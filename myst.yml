      children:
        - file: capitulos/01-calculadora.md
        - file: capitulos/02-preparador.md
        - file: capitulos/03-simbolicas.md
        - file: capitulos/04-funciones.md
        - file: capitulos/05-graficos.md
site:
  template: book-theme
  options:
    logo_text: ac | institut · Sage
    style: estilo/ac-institut.css
    folders: true
